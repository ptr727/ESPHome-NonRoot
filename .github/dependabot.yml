# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Each ecosystem appears once per branch (main + develop) so both stay current independently; rationale in
# GOVERNANCE.md "Branching Model".
# This repo ships a Docker image only: github-actions, the Docker base image, and the devcontainer.
version: 2
updates:

  # github-actions, main
  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"

  # github-actions, develop
  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"

  # docker (Docker/Dockerfile base image), main
  - package-ecosystem: "docker"
    target-branch: "main"
    directory: "/Docker"
    schedule:
      interval: "daily"
    # Hold Python at 3.14: ESP-IDF's Python deps lack 3.15 wheels, and the runtime image has no compiler.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker-deps:
        patterns:
          - "*"

  # docker (Docker/Dockerfile base image), develop
  - package-ecosystem: "docker"
    target-branch: "develop"
    directory: "/Docker"
    schedule:
      interval: "daily"
    # Hold Python at 3.14: ESP-IDF's Python deps lack 3.15 wheels, and the runtime image has no compiler.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker-deps:
        patterns:
          - "*"

  # Devcontainers ecosystem (.devcontainer/devcontainer.json), main
  - package-ecosystem: "devcontainers"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      devcontainers-deps:
        patterns:
          - "*"

  # Devcontainers ecosystem (.devcontainer/devcontainer.json), develop
  - package-ecosystem: "devcontainers"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      devcontainers-deps:
        patterns:
          - "*"
