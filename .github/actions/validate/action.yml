# The validate hook the hub's validate-task.yml runs in place of its no-op default, this repo's own domain check.
# It builds the image under test, checks its entrypoint scripts' arguments, and compiles firmware in it.
# The compile matters because the toolchains ESPHome downloads on first compile link against system libraries.
# A missing runtime package fails here and nowhere else, so lint and a build-only smoke cannot see it.
# The publisher always compiles, and pull request CI compiles when the image, what is compiled in it, or its hub pin changed.
# A composite action cannot read secrets, so the build reads the public base image and the shared cache without a Docker Hub login.
name: ESPHome-NonRoot validate hook
description: Check the entrypoint scripts' arguments, then compile every .github/compile-test configuration in the built image as a non-root user.

runs:
  using: composite
  steps:

    # Only a pull request run of the pull request workflow is gated, and the publisher and a dispatch always compile.
    # The diff runs from the test merge commit's first parent, the base tip, so it covers the whole pull request.
    # A later docs-only push therefore cannot retire a compile test.
    - name: Decide compile test step
      id: decide
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        REPOSITORY: ${{ github.repository }}
        AFTER: ${{ github.sha }}
      run: |
        set -Eeuo pipefail
        compile() {
          echo "compile=$1" >> "$GITHUB_OUTPUT"
          echo "Compile test: $1 ($2)"
          exit 0
        }
        if [[ "$EVENT" != "pull_request" || "$WORKFLOW_REF" != "$REPOSITORY/.github/workflows/test-pull-request.yml@"* ]]; then
          compile true "not a pull request workflow run"
        fi
        # The hub task checks out the merge commit alone, so fetch it again with its parents before reasoning about a diff.
        if ! git fetch --quiet --no-tags --depth=2 origin "$AFTER"; then
          compile true "history fetch failed"
        fi
        diff="$(git diff --no-renames --name-only "$AFTER^1" "$AFTER")"
        # The stubs pinning the validate and release tasks are gated, so a hub bump compile-tests the hooks under the new validate task.
        if grep -qE '^(Docker/|\.github/compile-test/|\.github/actions/(validate|docker-prepare)/|\.github/workflows/(test-pull-request|publish-release)\.yml$|upstream-version\.json$)' <<<"$diff"; then
          compile true "image or compile inputs changed"
        fi
        compile false "image and compile inputs unchanged"

    # The docker-prepare hook is the one reader of the upstream pins, so the image compiled here is built from the same inputs the publisher builds.
    # The image and semver2 values only name tags, which this local build replaces with its own.
    - name: Resolve build inputs step
      id: prepare
      if: ${{ steps.decide.outputs.compile == 'true' }}
      uses: ./.github/actions/docker-prepare
      with:
        image: ptr727/esphome-nonroot
        branch: develop
        semver2: compile-test

    - name: Read build inputs step
      id: entry
      if: ${{ steps.decide.outputs.compile == 'true' }}
      shell: bash
      env:
        MATRIX: ${{ steps.prepare.outputs.matrix }}
      run: |
        set -Eeuo pipefail
        {
          echo "context=$(jq -r '.[0].context' <<<"$MATRIX")"
          echo "dockerfile=$(jq -r '.[0].dockerfile' <<<"$MATRIX")"
          echo "cache-repo=$(jq -r '.[0]."cache-repo"' <<<"$MATRIX")"
          echo "build-args<<ARGEOF"
          jq -r '.[0]."build-args"[]' <<<"$MATRIX"
          echo "ARGEOF"
        } >> "$GITHUB_OUTPUT"

    - name: Setup Buildx step
      if: ${{ steps.decide.outputs.compile == 'true' }}
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      with:
        platforms: linux/amd64

    # The build is amd64 only, loaded into the local daemon so the next step can run it, reading the shared cache and never writing it.
    - name: Docker build step
      if: ${{ steps.decide.outputs.compile == 'true' }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ steps.entry.outputs.context }}
        file: ${{ steps.entry.outputs.dockerfile }}
        load: true
        push: false
        tags: esphome-nonroot:compile-test
        platforms: linux/amd64
        cache-from: |
          type=registry,ref=${{ steps.entry.outputs.cache-repo }}:buildcache-main
          type=registry,ref=${{ steps.entry.outputs.cache-repo }}:buildcache-develop
        build-args: ${{ steps.entry.outputs.build-args }}

    # It runs before the compile, so an argument break fails in seconds rather than after the toolchain downloads.
    - name: Check entrypoint arguments step
      if: ${{ steps.decide.outputs.compile == 'true' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        image=esphome-nonroot:compile-test
        out="$(mktemp)"
        err="$(mktemp)"
        failed=0
        fail() {
          echo "::error::$1"
          sed 's/^/    /' "$out" "$err" | tail -n 5
          failed=1
        }

        # A refusal is the result under test rather than a failure of the step, and the timeout ends a regression that launches the dashboard instead.
        run() {
          local code=0
          timeout 120 docker run --rm --user 1000:1000 "$@" > "$out" 2> "$err" || code=$?
          echo "$code"
        }

        for script in entrypoint cache dashboard; do
          entry=(--entrypoint "/entrypoint/$script.sh")
          help=""
          for flag in --help -h; do
            code="$(run "${entry[@]}" "$image" "$flag")"
            if [[ "$code" != 0 ]] || ! grep -q "^Usage: $script.sh" "$out"; then
              fail "$script.sh $flag exited $code without its usage line"
            elif [[ -z "$help" ]]; then
              help="$(cat "$out")"
            elif [[ "$(cat "$out")" != "$help" ]]; then
              fail "$script.sh -h and --help print different text"
            fi
          done
          code="$(run "${entry[@]}" "$image" --no-such-option)"
          if [[ "$code" == 0 || -s "$out" ]] || ! grep -q "unknown" "$err"; then
            fail "$script.sh --no-such-option exited $code without refusing it"
          fi
        done

        code="$(run "$image" entrypoint --no-such-option)"
        if [[ "$code" == 0 || -s "$out" ]] || ! grep -q "unknown" "$err"; then
          fail "entrypoint.sh entrypoint --no-such-option exited $code without refusing it"
        fi

        code="$(run "$image" esphome --help)"
        if [[ "$code" != 0 ]] || ! grep -qi "^usage: esphome" "$out"; then
          fail "esphome --help exited $code without esphome's own usage line"
        fi
        code="$(run "$image" esphome version)"
        if [[ "$code" != 0 ]] || ! grep -q "Version" "$out"; then
          fail "esphome version exited $code without a version"
        fi

        exit "$failed"

    - name: Compile test configurations step
      if: ${{ steps.decide.outputs.compile == 'true' }}
      shell: bash
      run: |
        set -Eeuo pipefail

        # The container runs as a non-root uid that owns nothing on the runner, so both mounts must be world-writable.
        workdir="$(mktemp -d)"
        mkdir -p "$workdir/config" "$workdir/cache"
        cp .github/compile-test/*.yaml "$workdir/config/"
        chmod -R 0777 "$workdir/config" "$workdir/cache"

        cat > "$workdir/config/compile.sh" <<'SH'
        set -Eeuo pipefail
        # A passed command skips cache.sh, so run it the way a real start does rather than leave each tool to create its own tree.
        /entrypoint/cache.sh
        for config in /config/*.yaml; do
          echo "::group::Compile $(basename "$config")"
          esphome config "$config" > /dev/null
          esphome compile "$config"
          echo "::endgroup::"
        done
        SH

        docker run --rm --user 1000:1000 \
          --volume "$workdir/config":/config \
          --volume "$workdir/cache":/cache \
          esphome-nonroot:compile-test \
          bash /config/compile.sh
