name: Publish project release action

# Thin caller onto the hub's reusable plan, validate, build-release, and Docker Hub readme tasks.
# One run publishes one branch, the trigger ref, so github.ref stays aligned with the branch NBGV versions.
# The weekly schedule rebuilds main, refreshing the python:3.14-slim base for CVEs and cutting a versioned GitHub release.
# A path-scoped push publishes main as soon as the upstream-version tracker's App merge lands a new upstream-version.json pin.
# A manual dispatch publishes the branch it is started from, main as latest and develop as the develop prerelease.
#
# Ordinary code merges do not publish: the plan task publishes a push only when a bot made it, so a hand-edited pin does not.
# The validate hook compiles firmware in the image on every publish, so a toolchain break blocks the push.
# The docker-prepare hook adds the upstream pins as build-args and, on main, the pinned ESPHome version tag.

on:
  workflow_dispatch:
  schedule:
    # Weekly rebuild and publish of main, Monday 02:00 UTC, to pick up base-image updates.
    - cron: '0 2 * * MON'
  push:
    branches: [main]
    paths: [upstream-version.json]

# GOVERNANCE.md "Workflow YAML Conventions" Concurrency exception (2).
# The expression must track publish-plan-task.yml's push rule and actor allowlist.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && (github.ref != 'refs/heads/main' || (github.actor != 'ptr727-codegen[bot]' && github.actor != 'dependabot[bot]')) && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# GITHUB_TOKEN gets no scope by default, and each job below grants only what its hub task writes with.
permissions: {}

jobs:

  # Single source of the release-gate decision (publish or not, stable or not), reused by every job below.
  plan:
    name: Plan release job
    uses: ptr727/ProjectTemplate/.github/workflows/publish-plan-task.yml@f610e4229f2acbb60d69f6d9386b341c81514534 # 2.0.1148
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  # The same reusable gate pull request CI runs, on the triggering commit, running only when a publish will happen.
  # The validate hook always compiles firmware here, since a publisher run is never change-gated.
  validate:
    name: Validate job
    needs: [plan]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@f610e4229f2acbb60d69f6d9386b341c81514534 # 2.0.1148
    permissions:
      contents: read

  # Version, build, and push the image for the trigger branch, then cut the GitHub release.
  publish:
    name: Publish project release job
    needs: [plan, validate]
    if: ${{ needs.plan.outputs.publish == 'true' && needs.validate.result == 'success' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@f610e4229f2acbb60d69f6d9386b341c81514534 # 2.0.1148
    permissions:
      contents: write
      # Lets the hub github-release job delete its transfer artifacts and dispatch a superseded release, though a Docker-only release uploads none.
      actions: write
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      # Pin to the triggering commit rather than the moving branch tip, so the version, the image, and the release tag share one commit.
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      smoke: false
      github: true
      dockerhub: true
      enable_docker: true
      enable_dotnet_publish: false
      enable_nuget: false
      enable_pypi: false
      # The image is the published artifact, so the release carries only the tag, the source zip, README, and LICENSE.
      expect_release_assets: false
      docker_image: ptr727/esphome-nonroot

  # Docker Hub does not read the GitHub README, so the overview is pushed from Docker/README.md, the hub default.
  # The task pushes only for main, so a develop publish leaves the one overview untouched.
  publish-docker-readme:
    name: Publish Docker Hub readme job
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.publish == 'true' && needs.publish.result == 'success' }}
    uses: ptr727/ProjectTemplate/.github/workflows/publish-docker-readme-task.yml@f610e4229f2acbb60d69f6d9386b341c81514534 # 2.0.1148
    permissions:
      contents: read
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      repositories: '["ptr727/esphome-nonroot"]'
