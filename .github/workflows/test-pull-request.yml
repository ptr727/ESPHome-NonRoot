name: Test pull request action

# CI for every pull request into main or develop, a thin caller onto the hub's reusable validate and build-release tasks.
# CI never publishes, since the publisher runs on schedule, dispatch, or a bot pin push.
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny by default: every job below grants only what its own task needs.
permissions: {}

jobs:

  # The one image target lists its own paths, and its build hook under .github/actions/** builds it, so a workflow-only or docs-only pull request marks nothing.
  changes:
    name: Detect changed targets job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filter changed paths step
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            release:
              - 'Docker/**'
              - 'version.json'
              - 'upstream-version.json'
              - '.github/actions/**'

  # The same reusable gate the publisher runs, which adds the prose gate on a pull request and change-gates the compile test.
  validate:
    name: Validate job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@1faf16c708bbe5fe6c4e053de0e327dd07b05b8c # 2.0.1209
    permissions:
      contents: read

  # Build the image (amd64 only, no push) to prove it ships, publishing nothing, through the same release task and docker-prepare hook the publisher uses.
  # The Docker Hub secrets are mapped even on smoke, since the hub task logs in on every build for the higher rate limit.
  smoke-build:
    name: Smoke build job
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true'
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@1faf16c708bbe5fe6c4e053de0e327dd07b05b8c # 2.0.1209
    permissions:
      contents: read
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      smoke: true
      github: false
      dockerhub: false
      enable_docker: true
      enable_dotnet_publish: false
      enable_nuget: false
      enable_pypi: false
      expect_release_assets: false
      docker_image: ptr727/esphome-nonroot
      # On a pull_request event github.ref_name is the PR ref (for example 123/merge), so the logical branch reads base_ref first.
      branch: ${{ github.base_ref || github.ref_name }}

  # Single required status check, whose name is the ruleset-bound context in the live branch rulesets.
  # Do not rename it without updating the rulesets in lockstep, and it must succeed, not merely not fail.
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    permissions: {}
    needs: [changes, validate, smoke-build]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "changes:${{ needs.changes.result }}" "validate:${{ needs.validate.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
          if [[ "${{ needs.smoke-build.result }}" != "success" && "${{ needs.smoke-build.result }}" != "skipped" ]]; then
            echo "::error::Job 'smoke-build' did not succeed (${{ needs.smoke-build.result }})."
            exit 1
          fi
