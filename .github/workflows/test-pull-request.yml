name: Test pull request action

# CI for every branch, a thin caller onto the hub's reusable validate and build-release tasks.
# Runs on push so the aggregator, the ruleset required status check, is produced on the head SHA by the sole producing run.
# validate and smoke-build run on every push with no paths filter, so a hub pin bump always exercises both hooks.
# Only the compile test inside the validate hook is change-gated, since it costs about five minutes and nothing it covers can move without the image or its test inputs changing.
# CI never publishes, since the publisher runs on schedule, dispatch, or a bot pin push.
#
# There is deliberately no pull_request trigger: a fork PR cannot push to this repo, so it produces no run and cannot satisfy the required check.
# A maintainer lands such a contribution on an in-repo branch, which pushes and so validates, before merging.
on:
  # All branches, but not tags, since a release tag must not re-run CI.
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny by default: every job below grants only what its own task needs.
permissions: {}

jobs:

  # The same reusable gate the publisher runs, so the push gate and the publish gate are identical.
  # A branch-deletion push is skipped, since github.sha is all zeros and the checkout would fail.
  validate:
    name: Validate job
    if: ${{ !github.event.deleted }}
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@fb7f02b24d6282f943ecb2ded1b206326d3f4610 # 2.0.1122
    permissions:
      contents: read

  # Build the image (amd64 only, no push) to prove it ships, publishing nothing, through the same release task and docker-prepare hook the publisher uses.
  # The Docker Hub secrets are mapped even on smoke, since the hub task logs in on every build for the higher rate limit.
  smoke-build:
    name: Smoke build job
    if: ${{ !github.event.deleted }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@fb7f02b24d6282f943ecb2ded1b206326d3f4610 # 2.0.1122
    permissions:
      contents: read
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      smoke: true
      github: false
      dockerhub: false
      enable_docker: true
      enable_dotnet_publish: false
      enable_nuget: false
      enable_pypi: false
      expect_release_assets: false
      docker_image: ptr727/esphome-nonroot
      branch: ${{ github.ref_name }}

  # Single required status check. Its name is the ruleset-bound context in the live branch rulesets.
  # Do not rename it without updating the rulesets in lockstep. It must succeed, not merely not fail.
  # Skips on a branch deletion, when the jobs it needs also skip, so the deletion push does not fail it.
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    permissions: {}
    needs: [validate, smoke-build]
    if: ${{ always() && !github.event.deleted }}
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "validate:${{ needs.validate.result }}" "smoke-build:${{ needs.smoke-build.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
