name: Check upstream version action

# Thin caller: the upstream-version tracker is the hub's reusable check-upstream-version-task.yml.
# The resolve-upstream hook resolves the latest ESPHome and Device Builder PyPI releases, the task writes them to upstream-version.json and opens a rolling bump PR per branch, and the merge-bot auto-merges it.
# The docker-prepare hook reads the same file for the image tag and build-args.

on:
  schedule:
    # Daily, which keeps the pins within about a day of PyPI.
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  # Ref-independent so a scheduled run and a manual dispatch cannot race the shared upstream-version-* branches.
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Every write in the called workflow uses the App token, so GITHUB_TOKEN gets no scope.
permissions: {}

jobs:

  check-upstream-version:
    name: Check upstream version job
    uses: ptr727/ProjectTemplate/.github/workflows/check-upstream-version-task.yml@d7041d8ce15356dfd9223e54d74c64d464f28335 # 2.0.1192
    secrets:
      CODEGEN_APP_CLIENT_ID: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
      CODEGEN_APP_PRIVATE_KEY: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}
