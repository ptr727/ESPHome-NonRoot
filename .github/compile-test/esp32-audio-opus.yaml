# ESP32 on ESP-IDF with the Opus audio codec, reduced to the component that triggers the failure.
# The esphome/micro-opus IDF component runs patch during CMake component discovery.
# No other configuration reaches that step.
# Modeled on sonocotta/esp32-audio-dock firmware/esphome/3-louder-esp32/louder-esp32-s3-idf-sendspin.yaml, the configuration that first hit the failure.

esphome:
  name: compile-test-esp32-opus

esp32:
  variant: esp32
  framework:
    type: esp-idf

audio:
  codecs:
    opus:

logger:
