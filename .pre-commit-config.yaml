repos:
  - repo: local
    hooks:
      - id: prose-gate
        name: prose/comment-style gate (diff-scoped, fetched fresh from ProjectTemplate@main)
        entry: uv run --no-project python hub_fetch_run.py .github/actions/prose-gate/prose_lint.py . --diff HEAD
        language: system
        pass_filenames: false
      - id: eol-gate
        name: line-ending consistency gate (fetched fresh from ProjectTemplate@main)
        entry: uv run --no-project python hub_fetch_run.py .github/actions/repo-gate/repo_gate.py --check eol
        language: system
        pass_filenames: false
